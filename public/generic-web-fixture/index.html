<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generic Web fixture</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 16px; }
    canvas { display: block; max-width: 100%; height: auto; border: 1px solid #888; }
    #status { white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>Generic Web fixture</h1>
    <p id="status">読み込み中…</p>
    <canvas id="preview" width="160" height="160"></canvas>
  </main>
  <script type="module">
    const status = document.querySelector('#status');
    const canvas = document.querySelector('#preview');
    const context = canvas.getContext('2d');
    try {
      const baseUrl = new URL('./', window.location.href);
      const packageManifest = await (await fetch(new URL('package-manifest.json', baseUrl))).json();
      const manifest = await (await fetch(new URL(packageManifest.files.distributionManifest, baseUrl))).json();
      const sidecar = await (await fetch(new URL(packageManifest.files.target, baseUrl))).json();
      const frame = manifest.frames[0];
      const image = new Image();
      image.src = new URL(manifest.pages[frame.page].path, baseUrl).href;
      await image.decode();
      context.drawImage(image, frame.rect.x, frame.rect.y, frame.rect.width, frame.rect.height, 16, 16, frame.contentRect.width * 4, frame.contentRect.height * 4);
      status.textContent = `読み込み成功: ${frame.name} / ${packageManifest.profile} / ${sidecar.coordinateSystem.origin}`;
    } catch (error) {
      status.textContent = error instanceof Error ? error.message : String(error);
      throw error;
    }
  </script>
</body>
</html>
