<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Phaser 4.2.0 fixture</title><style>body{margin:0;font-family:sans-serif;background:#111827;color:#f8fafc}main{max-width:720px;margin:0 auto;padding:16px;box-sizing:border-box}canvas{display:block;max-width:100%;height:auto;border:1px solid #64748b}#status{white-space:pre-wrap}</style></head>
<body><main><h1>Phaser 4.2.0 fixture</h1><p id="status">読み込み中…</p><div id="stage"></div></main>
<script src="https://cdn.jsdelivr.net/npm/phaser@4.2.0/dist/phaser.min.js"></script><script>
(async()=>{const status=document.querySelector('#status');const json=async url=>{const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()};const base=new URL('./',location.href);const pkg=await json(new URL('package-manifest.json',base));const manifest=await json(new URL(pkg.files.distributionManifest,base));if(pkg.engine!=='Phaser'||pkg.engineVersion!=='4.2.0')throw new Error('fixture metadata mismatch');if(!window.Phaser||Phaser.VERSION!=='4.2.0')throw new Error('Phaser runtime version mismatch');const frameHistory=[];let index=0,elapsed=0,game;const config={type:Phaser.AUTO,width:128,height:128,parent:'stage',backgroundColor:'#111827',scene:{preload,create,update}};function preload(){manifest.pages.forEach((p,i)=>this.load.image('page-'+i,new URL(p.path,base).href))}function create(){manifest.frames.forEach(f=>{const tex=this.textures.get('page-'+f.page);tex.add('frame-'+f.name,0,f.rect.x+f.contentRect.x,f.rect.y+f.contentRect.y,f.contentRect.width,f.contentRect.height)});this.sprite=this.add.sprite(manifest.frames[0].contentOffset.x,manifest.frames[0].contentOffset.y,'page-'+manifest.frames[0].page,'frame-'+manifest.frames[0].name).setOrigin(0,0);this.debug=this.add.graphics();this.debug.lineStyle(1,0xf8fafc);this.debug.lineBetween(manifest.origin.x-8,manifest.origin.y,manifest.origin.x+8,manifest.origin.y);this.debug.lineBetween(manifest.origin.x,manifest.origin.y-8,manifest.origin.x,manifest.origin.y+8);const r=manifest.colliders[0].rect;this.debug.lineStyle(1,0x22c55e);this.debug.strokeRect(r.x,r.y,r.width,r.height);const c=manifest.colliders[1].circle;this.debug.strokeCircle(c.x,c.y,c.radius);const show=()=>{const name=manifest.animations[0].frames[index];const f=manifest.frames.find(x=>x.name===name);this.sprite.setTexture('page-'+f.page,'frame-'+f.name).setPosition(f.contentOffset.x,f.contentOffset.y);if(frameHistory[frameHistory.length-1]!==name)frameHistory.push(name)};show();window.__g17.ready=true;window.__g17.frameHistory=frameHistory;status.textContent='Phaser 4.2.0 ready / pages='+manifest.pages.length+' / frame='+manifest.animations[0].frames[0]}function update(t,d){if(!window.__g17.ready)return;elapsed+=d;if(elapsed>=1000/manifest.animations[0].fps){elapsed=0;index=(index+1)%manifest.animations[0].frames.length;const f=manifest.frames.find(x=>x.name===manifest.animations[0].frames[index]);this.sprite.setTexture('page-'+f.page,'frame-'+f.name).setPosition(f.contentOffset.x,f.contentOffset.y);if(frameHistory[frameHistory.length-1]!==f.name)frameHistory.push(f.name)}}window.__g17={engine:'Phaser',version:Phaser.VERSION,pageCount:manifest.pages.length,manifest,pkg,frameHistory,ready:false,game:null,pixelAlpha:()=>{try{return Boolean(game&&game.canvas&&game.canvas.toDataURL('image/png').length>100)}catch(e){return false}}};game=new Phaser.Game(config);window.__g17.game=game})().catch(e=>{status.textContent='読み込み失敗: '+String(e);throw e});
</script></body></html>
