name: Group 19 Unity runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unity-runtime:
    name: Unity 6000.3.21f1 runtime
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Unity credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$UNITY_EMAIL" || { echo "::error::UNITY_EMAIL is required"; exit 1; }
          test -n "$UNITY_PASSWORD" || { echo "::error::UNITY_PASSWORD is required"; exit 1; }
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; then
            echo "::error::Set UNITY_LICENSE for a personal license or UNITY_SERIAL for a professional license"
            exit 1
          fi

      - name: Prepare engine-local fixture
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/g19/unity-runtime/project/Assets/G19Fixture
          rm -rf tools/g19/unity-runtime/project/TestResults test-results
          mkdir -p tools/g19/unity-runtime/project/Assets/G19Fixture test-results
          cp -R public/engine-fixtures/unity-6000-3-21f1/. tools/g19/unity-runtime/project/Assets/G19Fixture/

      - name: Run Unity runtime contract
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: tools/g19/unity-runtime/project
          unityVersion: 6000.3.21f1
          targetPlatform: StandaloneLinux64
          buildMethod: G19UnityRuntime.Run
          customParameters: -batchmode -nographics -quit
          allowDirtyBuild: true

      - name: Validate and collect runtime artifact
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p test-results
          if [ -s tools/g19/unity-runtime/project/TestResults/g19-unity-runtime.json ]; then
            cp tools/g19/unity-runtime/project/TestResults/g19-unity-runtime.json test-results/g19-unity-runtime.json
          else
            printf '%s\\n' '{"status":"missing","engine":"unity","version":"6000.3.21f1","importErrors":null}' > test-results/g19-unity-runtime.json
          fi
          jq -e '.status == "passed" and .importErrors == 0 and .engine == "unity" and .version == "6000.3.21f1"' test-results/g19-unity-runtime.json

      - name: Upload Unity runtime artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: group19-unity-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14
